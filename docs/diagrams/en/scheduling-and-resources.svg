<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="812" viewBox="0 0 1700 812" role="img" aria-labelledby="figure-title">
  <title id="figure-title">dsh-recollection scheduling and resource management</title>
  <desc>Task scheduling coordinates history preparation and file hash collection; call execution manages search and termination; cache management coordinates pinning, accounting, and eviction.</desc>
  <defs>
    <marker id="arrow" markerWidth="12.5" markerHeight="12.5" refX="10.5" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10.5 6 L1 11 Z" fill="#566678" />
    </marker>
  </defs>
  <style>
    .canvas { fill: #fff; }
    .region { fill: #f4f6f8; stroke: #8d9ba8; stroke-width: 3.35; }
    .entry-region, .channel-region, .call-region, .memory-region { stroke: #8d9ba8; }
    .region-label { fill: #273848; font: 700 29px 'Segoe UI',Arial,sans-serif; }
    .node { fill: #fff; stroke: #58697a; stroke-width: 3.1; }
    .entry-node { fill: #ffffff; stroke: #748596; }
    .scheduler-node { fill: #dfefe3; }
    .channel-node { fill: #dce9f8; }
    .call-node, .search-node, .control-node { fill: #e7e9f5; }
    .memory-node, .cache-node { fill: #f9e9d8; }
    .node-label { fill: #263544; font: 570 26px 'Segoe UI',Arial,sans-serif; text-anchor: middle; dominant-baseline:central; }
    .edge { fill: none; stroke: #566678; stroke-width: 3.65; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .edge.control-edge { stroke: #8393a2; stroke-dasharray: 8 8; }
  </style>

  <rect class="canvas" width="1700" height="812" />


  <g id="c:entry" data-kind="container"><rect class="region entry-region" x="50" y="28" width="690" height="280" rx="18" /><text class="region-label" x="78" y="70">Task scheduling</text></g>
  <g id="c:channels" data-kind="container"><rect class="region channel-region" x="50" y="330" width="690" height="220" rx="18" /><text class="region-label" x="78" y="373">Data preparation</text></g>
  <g id="c:calls" data-kind="container"><rect class="region call-region" x="840" y="28" width="810" height="522" rx="18" /><text class="region-label" x="868" y="70">Call execution</text></g>
  <g id="c:memory" data-kind="container"><rect class="region memory-region" x="50" y="600" width="1600" height="188" rx="18" /><text class="region-label" x="78" y="644">Cache</text></g>


