  <g id="n:match" data-kind="node"><rect class="node" x="450" y="124" width="235" height="72" rx="13" fill="#e7e9f5" /><text class="node-label" style="font-size:26px" x="567.5" y="160">Search matching</text></g>
  <g id="n:preview" data-kind="node"><rect class="node" x="790" y="124" width="235" height="72" rx="13" fill="#e7e9f5" /><text class="node-label" style="font-size:26px" x="907.5" y="160">Match snippets</text></g>
  <g id="n:history" data-kind="node"><rect class="node" x="110" y="348" width="235" height="72" rx="13" fill="#dce9f8" /><text class="node-label" style="font-size:26px" x="227.5" y="384">Original history</text></g>
  <g id="n:resolve" data-kind="node"><rect class="node" x="450" y="348" width="235" height="72" rx="13" fill="#dce9f8" /><text class="node-label" style="font-size:24px" x="567.5" y="384"><tspan x="567.5" y="371.52">Source</tspan><tspan x="567.5" y="396.48">validation</tspan></text></g>
  <g id="n:text" data-kind="node"><rect class="node" x="790" y="348" width="235" height="72" rx="13" fill="#dce9f8" /><text class="node-label" style="font-size:26px" x="907.5" y="384">Original text</text></g>
  <g id="n:files" data-kind="node"><rect class="node" x="110" y="568" width="235" height="72" rx="13" fill="#f9e9d8" /><text class="node-label" style="font-size:26px" x="227.5" y="604">Related files</text></g>
  <g id="n:baseline" data-kind="node"><rect class="node" x="110" y="696" width="235" height="72" rx="13" fill="#f9e9d8" /><text class="node-label" style="font-size:24px" x="227.5" y="732"><tspan x="227.5" y="719.52">Verification</tspan><tspan x="227.5" y="744.48">baseline</tspan></text></g>
  <g id="n:verify" data-kind="node"><rect class="node" x="450" y="626" width="235" height="72" rx="13" fill="#f9e9d8" /><text class="node-label" style="font-size:24px" x="567.5" y="662"><tspan x="567.5" y="649.52">Attachment</tspan><tspan x="567.5" y="674.48">verification</tspan></text></g>
  <g id="n:info" data-kind="node"><rect class="node" x="790" y="626" width="235" height="72" rx="13" fill="#f9e9d8" /><text class="node-label" style="font-size:24px" x="907.5" y="662"><tspan x="907.5" y="649.52">Attachment</tspan><tspan x="907.5" y="674.48">access results</tspan></text></g>
  <g id="n:organize" data-kind="node"><rect class="node" x="1240" y="189" width="235" height="72" rx="13" fill="#dfefe3" /><text class="node-label" style="font-size:26px" x="1357.5" y="225">Result assembly</text></g>
  <g id="n:budget" data-kind="node"><rect class="node" x="1240" y="419" width="235" height="72" rx="13" fill="#dfefe3" /><text class="node-label" style="font-size:26px" x="1357.5" y="455">Budget control</text></g>
  <g id="n:pagination" data-kind="node"><rect class="node" x="1240" y="649" width="235" height="72" rx="13" fill="#dfefe3" /><text class="node-label" style="font-size:26px" x="1357.5" y="685">Paged output</text></g>
