<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="855" viewBox="0 0 1580 855" role="img" aria-labelledby="diagram-title">
  <title id="diagram-title">Search and read</title>
  <desc>Search, reading, and attachment verification feed result assembly, followed by shared pagination within the context budget.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10.5 6 L1 11 Z" fill="#566678" />
    </marker>
  </defs>
  <style>
    .region { fill:#f4f6f8; stroke:#8d9ba8; stroke-width:2.8; }
    .region.no-border { stroke:none; }
    .region-label { font:700 26px 'Segoe UI',Arial,sans-serif; fill:#273848; }
    .node { stroke:#58697a; stroke-width:2.9; }
    .node-label { fill:#263544; font:570 26px 'Segoe UI',Arial,sans-serif; text-anchor:middle; dominant-baseline:central; }
    .edge { fill:none; stroke:#566678; stroke-width:3.25; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    .edge.control { stroke:#8393a2; stroke-dasharray:8 8; }
    .edge-label { fill:#465464; font:520 19px 'Segoe UI',Arial,sans-serif; text-anchor:middle; dominant-baseline:central; }
  </style>
  <rect width="1580" height="855" fill="#ffffff" />
  <g id="c:search" data-kind="container"><rect class="region" x="27" y="30" width="1105" height="215" rx="17" /><text class="region-label" x="49" y="71">Search</text></g>
  <g id="c:read" data-kind="container"><rect class="region" x="27" y="270" width="1105" height="215" rx="17" /><text class="region-label" x="49" y="311">Read</text></g>
  <g id="c:attachment" data-kind="container"><rect class="region" x="27" y="510" width="1105" height="316" rx="17" /><text class="region-label" x="49" y="551">Attachments</text></g>
  <g id="c:output" data-kind="container"><rect class="region" x="1164" y="30" width="388" height="796" rx="17" /><text class="region-label" x="1186" y="71">Result output</text></g>
  <g id="boundary-ports" aria-hidden="true">
    <rect x="1125" y="151" width="7" height="18" fill="#f4f6f8" />
    <rect x="1132" y="151" width="7" height="18" fill="#ffffff" />
    <rect x="1157" y="151" width="7" height="18" fill="#ffffff" />
    <rect x="1164" y="151" width="7" height="18" fill="#f4f6f8" />
    <rect x="1125" y="375" width="7" height="18" fill="#f4f6f8" />
    <rect x="1132" y="375" width="7" height="18" fill="#ffffff" />
    <rect x="1157" y="375" width="7" height="18" fill="#ffffff" />
    <rect x="1164" y="375" width="7" height="18" fill="#f4f6f8" />
    <rect x="1125" y="653" width="7" height="18" fill="#f4f6f8" />
    <rect x="1132" y="653" width="7" height="18" fill="#ffffff" />
    <rect x="1157" y="653" width="7" height="18" fill="#ffffff" />
    <rect x="1164" y="653" width="7" height="18" fill="#f4f6f8" />
  </g>
  <g id="e:records-match" data-from="records" data-to="match"><path class="edge" d="M345 160 H450" /></g>
  <g id="e:match-preview" data-from="match" data-to="preview"><path class="edge" d="M685 160 H790" /></g>
