  <g id="n:view" data-kind="node"><rect class="node entry-node" x="120" y="103" width="205" height="62" rx="13" /><text class="node-label" x="222.5" y="134">Active view</text></g>
  <g id="n:background" data-kind="node"><rect class="node entry-node" x="465" y="103" width="205" height="62" rx="13" /><text class="node-label" x="567.5" y="134" style="font-size:24px"><tspan x="567.5" y="121.52">Background</tspan><tspan x="567.5" y="146.48">tasks</tspan></text></g>
  <g id="n:scheduler" data-kind="node"><rect class="node scheduler-node" x="287.5" y="216" width="215" height="68" rx="13" /><text class="node-label" x="395" y="250" style="font-size:24px"><tspan x="395" y="237.52">Priority</tspan><tspan x="395" y="262.48">scheduling</tspan></text></g>
  <g id="n:history" data-kind="node"><rect class="node channel-node" x="140" y="418" width="218" height="70" rx="13" /><text class="node-label" x="249" y="453" style="font-size:24px"><tspan x="249" y="440.52">History</tspan><tspan x="249" y="465.48">preparation</tspan></text></g>
  <g id="n:hash" data-kind="node"><rect class="node channel-node" x="432" y="418" width="218" height="70" rx="13" /><text class="node-label" x="541" y="453" style="font-size:24px"><tspan x="541" y="440.52">Collect file</tspan><tspan x="541" y="465.48">hashes</tspan></text></g>
  <g id="n:calls" data-kind="node"><rect class="node call-node" x="1140" y="103" width="240" height="68" rx="13" /><text class="node-label" x="1260" y="137">Tool calls</text></g>
