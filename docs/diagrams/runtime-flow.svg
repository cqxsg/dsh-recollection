<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="675" height="820" viewBox="0 0 675 820" role="img" aria-labelledby="diagram-title">
  <title id="diagram-title">dsh-recollection · 运行流程</title>
  <desc>搜索后查看预览；根据需求展开原文，信息不足时继续搜索，结束回想后继续任务。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10.5 6 L1 11 Z" fill="#566678"/>
    </marker>
  </defs>
  <style>
    .region { fill:#f4f6f8; stroke:#8d9ba8; stroke-width:2.8; }
    .region.no-border { stroke:none; }
    .region-label { font:700 26px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#273848; }
    .node { stroke:#58697a; stroke-width:2.9; }
    .node-label { fill:#263544; font:570 26px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; text-anchor:middle; dominant-baseline:middle; }
    .edge { fill:none; stroke:#566678; stroke-width:3.25; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    .edge.control { stroke:#8393a2; stroke-dasharray:8 8; }
    .edge-label { fill:#465464; font:520 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="675" height="820" fill="#ffffff"/>
  <g id="e:need-search" data-from="need" data-to="search"><path class="edge" d="M330 134 V190"/></g>
  <g id="e:need-task" data-from="need" data-to="task"><path class="edge" d="M440 82 H635 V754 H440"/></g>
  <g id="e:search-preview" data-from="search" data-to="preview"><path class="edge" d="M330 262 V322"/></g>
  <g id="e:preview-enough" data-from="preview" data-to="stop"><path class="edge" d="M440 342 H585 V640 H440"/></g>
  <g id="e:preview-read" data-from="preview" data-to="read"><path class="edge" d="M330 394 V454"/></g>
  <g id="e:preview-search" data-from="preview" data-to="search"><path class="edge" d="M220 358 H160 V242 H220"/></g>
  <g id="e:read-search" data-from="read" data-to="search"><path class="edge" d="M220 490 H90 V210 H220"/></g>
  <g id="e:preview-stop" data-from="preview" data-to="stop"><path class="edge" d="M440 374 H500 V604 H440"/></g>
  <g id="e:read-stop" data-from="read" data-to="stop"><path class="edge" d="M330 526 V586"/></g>
  <g id="e:stop-task" data-from="stop" data-to="task"><path class="edge" d="M330 658 V718"/></g>
  <g id="n:need" data-kind="node"><polygon class="node" points="330,30 440,82 330,134 220,82" fill="#e7e9f5"/><text class="node-label" style="font-size:25px" x="330" y="83">需要回想？</text></g>
  <g id="n:search" data-kind="node"><rect class="node" x="220" y="190" width="220" height="72" rx="13" fill="#dce9f8"/><text class="node-label" style="font-size:26px" x="330" y="227">搜索历史</text></g>
  <g id="n:preview" data-kind="node"><rect class="node" x="220" y="322" width="220" height="72" rx="13" fill="#dce9f8"/><text class="node-label" style="font-size:26px" x="330" y="359">读取预览</text></g>
  <g id="n:read" data-kind="node"><rect class="node" x="220" y="454" width="220" height="72" rx="13" fill="#dce9f8"/><text class="node-label" style="font-size:26px" x="330" y="491">读取原文</text></g>
  <g id="n:stop" data-kind="node"><rect class="node" x="220" y="586" width="220" height="72" rx="13" fill="#f9e9d8"/><text class="node-label" style="font-size:26px" x="330" y="623">结束回想</text></g>
  <g id="n:task" data-kind="node"><rect class="node" x="220" y="718" width="220" height="72" rx="13" fill="#dfefe3"/><text class="node-label" style="font-size:26px" x="330" y="755">继续任务</text></g>
  <g aria-label="是"><rect x="341" y="148" width="36" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="359" y="162">是</text></g>
  <g aria-label="否"><rect x="512" y="52" width="36" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="530" y="66">否</text></g>
  <g aria-label="返回预览"><rect x="353.5" y="278" width="93" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="400" y="292">返回预览</text></g>
  <g aria-label="信息足够"><rect x="538.5" y="414" width="93" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="585" y="428">信息足够</text></g>
  <g aria-label="展开/续读"><rect x="343" y="410" width="104" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="395" y="424">展开/续读</text></g>
  <g aria-label="信息不足"><rect x="113.5" y="278" width="93" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="160" y="292">信息不足</text></g>
  <g aria-label="信息不足"><rect x="43.5" y="414" width="93" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="90" y="428">信息不足</text></g>
  <g aria-label="无线索/达限额"><rect x="429" y="542" width="142" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="500" y="556">无线索/达限额</text></g>
  <g aria-label="读取完成"><rect x="223.5" y="542" width="93" height="28" rx="6" fill="#ffffff"/><text class="edge-label" x="270" y="556">读取完成</text></g>
</svg>
